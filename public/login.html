<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · Poster Penelitian</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="login-body"><div class="login"><form class="box" id="f">
  <h1>Poster Penelitian</h1><p>Masuk dengan akun staf TU prodi.</p>
  <label>Nama pengguna<input type="text" name="username" autocomplete="username" autofocus required></label>
  <label>Kata sandi<input type="password" name="sandi" autocomplete="current-password" required></label>
  <p id="msg" style="color:var(--err);font-size:14px;font-weight:600;margin:12px 0 0"></p>
  <button class="btn pri" type="submit">Masuk</button>
</form></div>
<script>
const BASE = document.querySelector('base')?.getAttribute('href')?.replace(/\/+$/, '') 
  || (location.pathname.startsWith('/poster') ? '/poster' : '');
const u = path => BASE + (path.startsWith('/') ? path : '/' + path);

document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const f=e.target,m=document.getElementById('msg');m.textContent='';
  try{
    const r=await fetch(u('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,sandi:f.sandi.value})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Gagal masuk');
    const n=new URLSearchParams(location.search).get('next');
    location.href=(n&&n.startsWith('/')&&!n.startsWith('//'))?n:u('/');
  }catch(err){m.textContent=err.message}
};
</script></body></html>
