<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Poster Penelitian</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<div class="bar" id="bar"></div>
<div class="wrap">
  <div class="tabs2" id="tabs"></div>
  <div id="v"></div>
</div>
<script src="assets/app.js"></script>
<script>
const TABS = [['pengguna', 'Pengguna'], ['prodi', 'Prodi'], ['biaya', 'Komponen biaya'], ['kunci', 'Kunci API'], ['webhook', 'Webhook & log']];
let prodi = [], tab = location.hash.slice(1) || 'pengguna';
const opsiProdi = (sel, semua) => (semua ? `<option value="">${semua}</option>` : '') + prodi.map(p => `<option value="${p.id}" ${String(sel) === String(p.id) ? 'selected' : ''}>${esc(p.nama)}</option>`).join('');
const J = (m, b) => jsonOpt(m, b);

function modal(judul, isi, oke, onOk) {
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog"><h3>${judul}</h3>${isi}<p class="err" style="color:var(--err);font-size:13px;margin:8px 0 0"></p><div class="row"><button type="button" class="btn" data-x>Batal</button><button class="btn pri">${oke}</button></div></form>`;
  document.body.appendChild(d); d.showModal();
  const tutup = () => { d.close(); d.remove(); };
  $('[data-x]', d).onclick = tutup;
  $('form', d).onsubmit = async e => { e.preventDefault(); try { await onOk($('form', d)); tutup(); } catch (err) { $('.err', d).textContent = err.message; } };
}
function info(judul, isi) {
  const d = document.createElement('dialog');
  d.innerHTML = `<h3>${judul}</h3>${isi}<div class="row"><button class="btn pri" data-x>Tutup</button></div>`;
  document.body.appendChild(d); d.showModal(); $('[data-x]', d).onclick = () => { d.close(); d.remove(); };
}
const konfirm = (teks, onYa) => modal('Konfirmasi', `<p style="margin:0">${teks}</p>`, 'Ya, lanjutkan', async () => onYa());

// ---------- Pengguna ----------
async function vPengguna() {
  const rows = await api('/api/admin/pengguna');
  $('#v').innerHTML = `
  <div class="panel"><h3>Tambah akun</h3><form id="fp" class="inline">
    <label>Nama pengguna<input type="text" name="username" required placeholder="tu.manajemen"></label>
    <label>Nama lengkap<input type="text" name="nama" required></label>
    <label>Peran<select name="peran" id="peran"><option value="tu">Staf TU prodi</option><option value="admin">Admin</option></select></label>
    <label>Prodi<select name="prodi_id" id="pr">${opsiProdi('', '— pilih —')}</select></label>
    <label>Kata sandi awal <span class="h">(kosong = acak)</span><input type="text" name="sandi" placeholder="min. 8 karakter"></label>
    <button class="btn pri">Tambah</button></form></div>
  <table class="tbl"><thead><tr><th>Pengguna</th><th>Peran</th><th>Prodi</th><th class="hide-m">Data</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(u => `
    <tr><td><b>${esc(u.username)}</b><div class="sub">${esc(u.nama)}</div></td>
    <td><span class="chip ${u.peran === 'admin' ? 'warn' : ''}">${u.peran === 'admin' ? 'Admin' : 'Staf TU'}</span></td>
    <td>${esc(u.prodi_nama || '—')}</td><td class="hide-m">${u.jml_data}</td>
    <td><span class="chip ${u.aktif ? 'ok' : 'off'}">${u.aktif ? 'Aktif' : 'Nonaktif'}</span>${u.sandi_default ? ' <span class="chip warn" title="Belum mengganti kata sandi awal">sandi awal</span>' : ''}</td>
    <td class="act"><button class="btn sm" data-e="${u.id}">Edit</button><button class="btn sm" data-r="${u.id}">Reset sandi</button><button class="btn sm danger" data-d="${u.id}" data-n="${esc(u.username)}">Hapus</button></td></tr>`).join('')}</tbody></table>`;
  $('#peran').onchange = e => { $('#pr').disabled = e.target.value === 'admin'; }; 
  $('#fp').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try {
      const r = await api('/api/admin/pengguna', J('POST', { username: f.username.value, nama: f.nama.value, peran: f.peran.value, prodi_id: f.prodi_id.value, sandi: f.sandi.value }));
      info('Akun dibuat', `<p>Nama pengguna: <b>${esc(r.username)}</b></p><p>Kata sandi awal (catat dan berikan ke yang bersangkutan; ia akan diminta menggantinya):</p><div class="secret">${esc(r.sandi_awal)}</div>`);
      vPengguna();
    } catch (err) { alert(err.message); }
  };
  $$('[data-e]').forEach(b => b.onclick = () => { const u = rows.find(x => x.id == b.dataset.e);
    modal('Edit akun ' + esc(u.username), `<label>Nama lengkap<input type="text" name="nama" value="${esc(u.nama)}" required></label>
      <label>Peran<select name="peran"><option value="tu" ${u.peran === 'tu' ? 'selected' : ''}>Staf TU prodi</option><option value="admin" ${u.peran === 'admin' ? 'selected' : ''}>Admin</option></select></label>
      <label>Prodi<select name="prodi_id">${opsiProdi(u.prodi_id, '—')}</select></label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="aktif" ${u.aktif ? 'checked' : ''}> Akun aktif</label>`, 'Simpan',
      async f => { await api('/api/admin/pengguna/' + u.id, J('PUT', { nama: f.nama.value, peran: f.peran.value, prodi_id: f.prodi_id.value, aktif: f.aktif.checked })); vPengguna(); }); });
  $$('[data-r]').forEach(b => b.onclick = () => konfirm('Reset kata sandi akun ini? Kata sandi baru dibuat acak dan sesi login akun itu diakhiri.', async () => {
    const r = await api(`/api/admin/pengguna/${b.dataset.r}/reset-sandi`, J('POST', {}));
    setTimeout(() => info('Kata sandi baru', `<div class="secret">${esc(r.sandi_baru)}</div>`), 50); vPengguna(); }));
  $$('[data-d]').forEach(b => b.onclick = () => konfirm(`Hapus akun <b>${b.dataset.n}</b>? Data penelitian yang dibuatnya tetap ada.`, async () => { await api('/api/admin/pengguna/' + b.dataset.d, { method: 'DELETE' }); vPengguna(); }));
}

// ---------- Prodi ----------
async function vProdi() {
  prodi = await api('/api/prodi');
  $('#v').innerHTML = `<div class="panel"><h3>Tambah prodi</h3><form id="fp" class="inline"><label>Kode<input type="text" name="kode" required placeholder="teknik-sipil"></label><label>Fakultas<input type="text" name="fakultas" list="dlFak" placeholder="Fakultas Hukum"></label><label>Nama prodi<input type="text" name="nama" required></label><datalist id="dlFak">${[...new Set(prodi.map(p => p.fakultas).filter(Boolean))].map(f => `<option value="${esc(f)}">`).join('')}</datalist><button class="btn pri">Tambah</button></form></div>
  <table class="tbl"><thead><tr><th>Fakultas</th><th>Kode</th><th>Nama</th><th></th></tr></thead><tbody>${prodi.map(p => `<tr><td class="sub">${esc(p.fakultas || '-')}</td><td>${esc(p.kode)}</td><td>${esc(p.nama)}</td><td class="act"><button class="btn sm" data-e="${p.id}">Ubah</button><button class="btn sm danger" data-d="${p.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`;
  $('#fp').onsubmit = async e => { e.preventDefault(); const f = e.target; try { await api('/api/admin/prodi', J('POST', { kode: f.kode.value, nama: f.nama.value, fakultas: f.fakultas.value })); vProdi(); } catch (err) { alert(err.message); } };
  $$('[data-e]').forEach(b => b.onclick = () => { const p = prodi.find(x => x.id == b.dataset.e); modal('Ubah prodi', `<label>Fakultas<input type="text" name="fakultas" value="${esc(p.fakultas || '')}"></label><label>Nama<input type="text" name="nama" value="${esc(p.nama)}" required></label>`, 'Simpan', async f => { await api('/api/admin/prodi/' + p.id, J('PUT', { nama: f.nama.value, fakultas: f.fakultas.value })); vProdi(); }); });
  $$('[data-d]').forEach(b => b.onclick = () => konfirm('Hapus prodi ini? (hanya bisa jika belum dipakai data atau akun)', async () => { await api('/api/admin/prodi/' + b.dataset.d, { method: 'DELETE' }); vProdi(); }));
}

// ---------- Komponen biaya ----------
let biayaJenis = 'skripsi';
async function vBiaya() {
  const d = await api('/api/admin/komponen-biaya');
  const daftar = d.komponen.filter(k => k.jenis === biayaJenis);
  const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
  const totalTetap = daftar.filter(k => k.aktif && k.mode === 'tetap').reduce((a, k) => a + k.nominal, 0);
  const formKomp = k => `<label>Nama komponen<input type="text" name="nama" value="${esc(k?.nama || '')}" required maxlength="120"></label>
    <label>Pengisian nominal<select name="mode"><option value="tetap" ${k?.mode !== 'bebas' ? 'selected' : ''}>Tetap (mengikuti angka di bawah)</option><option value="bebas" ${k?.mode === 'bebas' ? 'selected' : ''}>Bebas (diisi pengguna; angka di bawah hanya contoh isian)</option></select></label>
    <label>Nominal (Rp)<input type="text" inputmode="numeric" name="nominal" value="${k ? Math.round(k.nominal) : 0}"></label>
    <div style="margin:8px 0"><b style="font-size:13px">Sumber dana tercentang otomatis</b> <span class="sub">(pengguna tetap bisa memilih ketiganya)</span><div>${d.sumber_dana.map(s => `<label style="display:inline-flex;gap:5px;align-items:center;margin-right:14px;font-weight:400"><input type="checkbox" name="sumber" value="${esc(s)}" ${(k?.sumber || [d.sumber_dana[0]]).includes(s) ? 'checked' : ''} style="width:auto;margin:0"> ${esc(s)}</label>`).join('')}</div></div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="aktif" ${k?.aktif !== false ? 'checked' : ''} style="width:auto;margin:0"> Aktif (tampil di formulir)</label>`;
  const baca = (f, jenis) => ({ jenis, nama: f.nama.value, mode: f.mode.value, nominal: f.nominal.value, sumber: [...f.querySelectorAll('input[name=sumber]:checked')].map(i => i.value), aktif: f.aktif.checked });
  $('#v').innerHTML = `<div class="note" style="margin-bottom:14px">Atur komponen biaya untuk tiap jenis penelitian. <b>Tetap</b>: nominal otomatis sesuai angka yang Anda tetapkan. <b>Bebas</b>: pengguna mengisi sendiri. Total dijumlahkan otomatis; poster hanya menampilkan total. Perubahan berlaku untuk poster yang disimpan setelahnya; poster lama tidak berubah sampai diedit dan disimpan ulang.</div>
  <div class="tabs2" id="tj" style="margin-bottom:12px">${d.jenis.map(j => `<button data-j="${j.k}" class="${j.k === biayaJenis ? 'on' : ''}">${esc(j.label)}</button>`).join('')}</div>
  <p style="margin:0 0 8px"><button class="btn pri sm" id="tbKomp">+ Tambah komponen</button> <span class="sub">Total komponen tetap aktif: <b>${rp(totalTetap)}</b></span></p>
  <table class="tbl"><thead><tr><th>Komponen</th><th>Sumber dana bawaan</th><th>Mode</th><th class="r" style="text-align:right">Nominal</th><th></th></tr></thead><tbody>${daftar.map((k, i) => `<tr style="${k.aktif ? '' : 'opacity:.5'}"><td><b>${esc(k.nama)}</b>${k.aktif ? '' : ' <span class="chip off">nonaktif</span>'}</td><td class="sub">${esc(k.sumber.join(', '))}</td><td><span class="chip ${k.mode === 'tetap' ? 'ok' : 'warn'}">${k.mode === 'tetap' ? 'Tetap' : 'Bebas'}</span></td><td style="text-align:right">${rp(k.nominal)}${k.mode === 'bebas' ? '<div class="sub">contoh</div>' : ''}</td><td class="act"><button class="btn sm" data-u="${k.id}" ${i === 0 ? 'disabled' : ''}>▲</button><button class="btn sm" data-b="${k.id}" ${i === daftar.length - 1 ? 'disabled' : ''}>▼</button><button class="btn sm" data-e="${k.id}">Edit</button><button class="btn sm danger" data-d="${k.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="5" class="sub">Belum ada komponen.</td></tr>'}</tbody></table>`;
  $$('#tj button').forEach(b => b.onclick = () => { biayaJenis = b.dataset.j; vBiaya(); });
  $('#tbKomp').onclick = () => modal('Tambah komponen', formKomp(null), 'Simpan', async f => { await api('/api/admin/komponen-biaya', J('POST', baca(f, biayaJenis))); vBiaya(); });
  $$('[data-e]').forEach(b => b.onclick = () => { const k = d.komponen.find(x => x.id == b.dataset.e); modal('Edit komponen', formKomp(k), 'Simpan', async f => { await api('/api/admin/komponen-biaya/' + k.id, J('PUT', baca(f, k.jenis))); vBiaya(); }); });
  $$('[data-u],[data-b]').forEach(b => b.onclick = async () => { await api(`/api/admin/komponen-biaya/${b.dataset.u || b.dataset.b}/geser`, J('POST', { arah: b.dataset.u ? 'atas' : 'bawah' })); vBiaya(); });
  $$('[data-d]').forEach(b => b.onclick = () => konfirm('Hapus komponen ini? (Poster lama tetap menyimpan rinciannya sendiri.)', async () => { await api('/api/admin/komponen-biaya/' + b.dataset.d, { method: 'DELETE' }); vBiaya(); }));
}

// ---------- Kunci API ----------
async function vKunci() {
  const rows = await api('/api/admin/kunci');
  $('#v').innerHTML = `<div class="note" style="margin-bottom:14px">Kunci API dipakai aplikasi lain untuk membaca data dan mengunduh poster lewat <code>/api/v1</code>. Gunakan header <code>Authorization: Bearer &lt;kunci&gt;</code>. Panduan lengkap: <b>API.md</b>.</div>
  <div class="panel"><h3>Buat kunci baru</h3><form id="fk" class="inline"><label>Nama aplikasi<input type="text" name="nama" required placeholder="mis. Portal Kampus"></label><label>Lingkup<select name="prodi_id">${opsiProdi('', 'Semua prodi')}</select></label><button class="btn pri">Buat kunci</button></form></div>
  <table class="tbl"><thead><tr><th>Nama</th><th>Awalan</th><th>Lingkup</th><th class="hide-m">Terakhir dipakai</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(k => `<tr><td><b>${esc(k.nama)}</b></td><td><code>${esc(k.prefiks)}…</code></td><td>${esc(k.prodi_nama || 'Semua prodi')}</td><td class="hide-m sub">${k.terakhir_dipakai ? fmtTgl(k.terakhir_dipakai) : 'belum pernah'}</td><td><span class="chip ${k.aktif ? 'ok' : 'off'}">${k.aktif ? 'Aktif' : 'Nonaktif'}</span></td><td class="act"><button class="btn sm" data-t="${k.id}" data-a="${k.aktif}">${k.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button><button class="btn sm danger" data-d="${k.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`;
  $('#fk').onsubmit = async e => { e.preventDefault(); const f = e.target; try { const r = await api('/api/admin/kunci', J('POST', { nama: f.nama.value, prodi_id: f.prodi_id.value })); info('Kunci API dibuat', `<p>Salin sekarang. Kunci lengkap <b>tidak akan ditampilkan lagi</b>.</p><div class="secret">${esc(r.kunci)}</div>`); vKunci(); } catch (err) { alert(err.message); } };
  $$('[data-t]').forEach(b => b.onclick = async () => { await api('/api/admin/kunci/' + b.dataset.t, J('PUT', { aktif: b.dataset.a !== 'true' })); vKunci(); });
  $$('[data-d]').forEach(b => b.onclick = () => konfirm('Hapus kunci ini? Aplikasi yang memakainya akan ditolak.', async () => { await api('/api/admin/kunci/' + b.dataset.d, { method: 'DELETE' }); vKunci(); }));
}

// ---------- Webhook ----------
async function vWebhook() {
  const [rows, log] = await Promise.all([api('/api/admin/webhook'), api('/api/admin/webhook-log')]);
  $('#v').innerHTML = `<div class="note" style="margin-bottom:14px">Webhook = alamat aplikasi lain yang <b>diberi tahu otomatis</b> saat data penelitian dibuat, diperbarui, atau dihapus (berisi tautan poster). Staf juga dapat <b>mengirim berkas poster</b> ke tujuan ini dari halaman poster. Setiap kiriman bertanda tangan HMAC-SHA256 memakai rahasia tujuan.</div>
  <div class="panel"><h3>Tambah tujuan</h3><form id="fw" class="inline"><label>Nama<input type="text" name="nama" required placeholder="mis. Portal Kampus"></label><label>URL penerima<input type="text" name="url" required placeholder="https://aplikasi.contoh/hook"></label><label>Prodi<select name="prodi_id">${opsiProdi('', 'Semua prodi')}</select></label><label>Rahasia <span class="h">(kosong = acak)</span><input type="text" name="rahasia"></label><button class="btn pri">Tambah</button></form></div>
  <table class="tbl"><thead><tr><th>Nama</th><th>URL</th><th>Rahasia</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(w => `<tr><td><b>${esc(w.nama)}</b><div class="sub">${esc(w.prodi_nama || 'Semua prodi')}</div></td><td class="sub" style="word-break:break-all">${esc(w.url)}</td><td><button class="btn sm" data-s="${esc(w.rahasia)}">Tampilkan</button></td><td><span class="chip ${w.aktif ? 'ok' : 'off'}">${w.aktif ? 'Aktif' : 'Nonaktif'}</span></td><td class="act"><button class="btn sm" data-p="${w.id}">Uji</button><button class="btn sm" data-t="${w.id}" data-a="${w.aktif}" data-n="${esc(w.nama)}" data-u="${esc(w.url)}" data-pr="${w.prodi_id || ''}">${w.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button><button class="btn sm danger" data-d="${w.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="5" class="sub">Belum ada tujuan.</td></tr>'}</tbody></table>
  <h3 style="margin:22px 0 8px;color:var(--pd)">Riwayat pengiriman terakhir</h3>
  <table class="tbl"><thead><tr><th>Waktu</th><th>Tujuan</th><th>Peristiwa</th><th>Hasil</th></tr></thead><tbody>${log.map(l => `<tr><td class="sub">${fmtTgl(l.waktu)}</td><td>${esc(l.webhook_nama || '—')}</td><td>${esc(l.event)}${l.slug ? `<div class="sub">${esc(l.slug)}</div>` : ''}</td><td><span class="chip ${l.ok ? 'ok' : 'off'}">${l.ok ? 'Berhasil' : 'Gagal'}</span> <span class="sub">${esc(l.status || '')} ${l.ok ? '' : esc(l.detail || '')}</span></td></tr>`).join('') || '<tr><td colspan="4" class="sub">Belum ada.</td></tr>'}</tbody></table>`;
  $('#fw').onsubmit = async e => { e.preventDefault(); const f = e.target; try { await api('/api/admin/webhook', J('POST', { nama: f.nama.value, url: f.url.value, prodi_id: f.prodi_id.value, rahasia: f.rahasia.value })); vWebhook(); } catch (err) { alert(err.message); } };
  $$('[data-s]').forEach(b => b.onclick = () => info('Rahasia tanda tangan', `<div class="secret">${esc(b.dataset.s)}</div>`));
  $$('[data-p]').forEach(b => b.onclick = async () => { b.textContent = '…'; const r = await api(`/api/admin/webhook/${b.dataset.p}/tes`, J('POST', {})); alert(r.ok ? 'Berhasil (HTTP ' + r.status + ')' : 'Gagal: ' + (r.detail || r.status)); vWebhook(); });
  $$('[data-t]').forEach(b => b.onclick = async () => { await api('/api/admin/webhook/' + b.dataset.t, J('PUT', { nama: b.dataset.n, url: b.dataset.u, prodi_id: b.dataset.pr, aktif: b.dataset.a !== 'true' })); vWebhook(); });
  $$('[data-d]').forEach(b => b.onclick = () => konfirm('Hapus tujuan ini?', async () => { await api('/api/admin/webhook/' + b.dataset.d, { method: 'DELETE' }); vWebhook(); }));
}

const VIEWS = { pengguna: vPengguna, prodi: vProdi, biaya: vBiaya, kunci: vKunci, webhook: vWebhook };
async function tampil(t) {
  tab = VIEWS[t] ? t : 'pengguna'; location.hash = tab;
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => tampil(b.dataset.k));
  await VIEWS[tab]();
}
(async () => { await initHeader('admin', 'Poster Penelitian · Admin'); prodi = await api('/api/prodi'); tampil(tab); })();
</script></body></html>
